plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aidfinder'
    compileSdk 35

    defaultConfig {
        applicationId "com.aidfinder"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Where the Python service lives.
        // 10.0.2.2 is how the Android emulator reaches your own computer's
        // localhost. A real phone cannot use this - see README.
        buildConfigField "String", "AI_BASE_URL", '"http://10.0.2.2:8001/"'

        // Shared secret so random people cannot call your service and burn
        // your API credits. Must match APP_TOKEN in the Python .env file.
        buildConfigField "String", "APP_TOKEN", '"change-me-before-you-ship"'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Production points at your hosted service over HTTPS.
            buildConfigField "String", "AI_BASE_URL", '"https://your-service.onrender.com/"'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ViewModel keeps results alive when the screen rotates
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.6'

    // HTTP + JSON
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    testImplementation 'junit:junit:4.13.2'
}
